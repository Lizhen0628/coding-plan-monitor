name: CodingPlanMonitor
options:
  bundleIdPrefix: com.lizhen
  deploymentTarget:
    macOS: "14.0"

targets:
  CodingPlanMonitor:
    type: application
    platform: macOS
    sources:
      - path: Sources/CodingPlanMonitor
      - path: Assets.xcassets
      - path: PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhen.CodingPlanMonitor
        PRODUCT_NAME: Coding Plan Monitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Coding Plan Monitor"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: CodingPlanMonitor.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: P7AQ8USFDY
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Apple Distribution"
    scheme:
      gatherCoverageData: false
