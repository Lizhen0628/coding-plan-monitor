name: CodingPlanMonitor
options:
  bundleIdPrefix: com.lizhen
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CodingPlanMonitor-macOS:
    type: application
    platform: macOS
    sources:
      - path: macOS/Sources
      - path: macOS/Assets.xcassets
      - path: macOS/PrivacyInfo.xcprivacy
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhen.CodingPlanMonitor
        PRODUCT_NAME: Coding Plan Monitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Coding Plan Monitor"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: macOS/CodingPlanMonitor.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2CV6VKVD26
        ENABLE_HARDENED_RUNTIME: YES
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  CodingPlanMonitor-iOS:
    type: application
    platform: iOS
    sources:
      - path: iOS/Sources/CodingPlanMonitor
      - path: iOS/Sources/Shared
      - path: iOS/Assets.xcassets
      - path: Shared
    dependencies:
      - target: UsageWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhen.CodingPlanMonitor
        PRODUCT_NAME: Coding Plan Monitor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Configuration/CodingPlanMonitor-Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Entitlements/CodingPlanMonitor.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2CV6VKVD26
        SWIFT_VERSION: "6.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

  UsageWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: iOS/Sources/UsageWidget
      - path: iOS/Sources/Shared
      - path: Shared/Models.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lizhen.CodingPlanMonitor.UsageWidget
        PRODUCT_NAME: UsageWidget
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: iOS/Configuration/UsageWidget-Info.plist
        CODE_SIGN_ENTITLEMENTS: iOS/Entitlements/UsageWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 2CV6VKVD26
        SWIFT_VERSION: "6.0"
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "Apple Development"
        Release:
          CODE_SIGN_IDENTITY: "Apple Development"

schemes:
  CodingPlanMonitor-macOS:
    build:
      targets:
        CodingPlanMonitor-macOS: all
  CodingPlanMonitor-iOS:
    build:
      targets:
        CodingPlanMonitor-iOS: all
